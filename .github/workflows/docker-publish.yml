name: Build and Push Docker Image

on:
  push:
    # 触发条件 1：当你推送到 main 分支时触发
    branches:
      - main
    # 仅在修改了指定目录下的源码或 Dockerfile 时才触发构建，避免改个 README 也重新打包
    paths:
      - 'open_nsfw/**'
      - 'web/**'
      - 'Dockerfile'
    # 触发条件 2：当你发布版本打 tag 时触发（例如 v1.0.0）
    tags:
      - 'v*'
  # 触发条件 3：允许你在 GitHub 网页上手动点击运行
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 自动提取你的仓库名
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 登录到 GitHub Container Registry (GHCR)
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 设置 QEMU，用于支持构建多架构镜像（比如同时支持 amd64 电脑和 arm64 树莓派）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # 设置 Docker Buildx（增强版构建工具）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 自动提取版本标签（如果是 main 分支就是 latest，如果是 tag 就是对应的版本号）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # 核心步骤：开始构建并推送到 GitHub 镜像库
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # 关键：指定你的 Dockerfile 所在的上下文目录
          context: .
          file: ./Dockerfile
          # 构建多架构镜像
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false